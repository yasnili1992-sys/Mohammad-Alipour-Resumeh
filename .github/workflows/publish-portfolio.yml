name: Publish Mohammad Ali Pour portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-portfolio.yml'
      - 'resume-package.zip.part-*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare portfolio and inspect original media paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          shopt -s nullglob
          parts=(resume-package.zip.part-*)
          if [ "${#parts[@]}" -eq 3 ]; then
            cat "${parts[@]}" > resume-package.zip
            unzip -tq resume-package.zip
            mkdir extracted
            unzip -oq resume-package.zip -d extracted
            test -f extracted/index.html
            cp extracted/index.html public/index.html
            echo "SOURCE=uploaded complete archive"
          else
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
              -D /tmp/portfolio-headers.txt \
              "https://mohammad-ali-pour-resume.flutedant3.chatgpt.site/" \
              --output public/index.html
            echo "SOURCE=current published portfolio page"
          fi
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          p=Path("public/index.html")
          text=p.read_text("utf-8")
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.img=[]; self.scripts=[]; self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=="img": self.img.append(a.get("src",""))
                  if tag=="script": self.scripts.append(a.get("src",""))
                  if tag=="link": self.links.append(a.get("href",""))
          parser=P(); parser.feed(text)
          print("HTML_BYTES:", p.stat().st_size)
          print("IMG_TAGS:", len(parser.img))
          print("IMAGE_SRC_SAMPLE:", parser.img[:30])
          print("SCRIPT_URLS:", parser.scripts[:20])
          print("LINK_URLS:", parser.links[:20])
          print("HAS_SKILL:", "سناریونویسی و ساخت فیلم‌های تبلیغاتی" in text)
          print("HAS_ABAN_SECTION:", "آبان" in text)
          PY
          if [ -f /tmp/portfolio-headers.txt ]; then
            echo "=== RESPONSE HEADERS ==="
            cat /tmp/portfolio-headers.txt
          fi
          test -s public/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
