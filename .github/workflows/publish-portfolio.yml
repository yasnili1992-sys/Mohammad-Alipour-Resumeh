name: Publish Mohammad Ali Pour portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-portfolio.yml'
      - 'resume-package.zip.part-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download complete portfolio page and its original images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://mohammad-ali-pour-resume.flutedant3.chatgpt.site/" \
            --output public/index.html
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html.parser import HTMLParser
          import re, time

          base = "https://mohammad-ali-pour-resume.flutedant3.chatgpt.site/"
          page = Path("public/index.html")
          text = page.read_text("utf-8")

          # Keep the current interactive portfolio and fetch every referenced full-size WebP asset.
          paths = sorted(set(re.findall(r'assets/[A-Za-z0-9._/-]+\.webp', text, flags=re.I)))
          if len(paths) < 200:
              raise SystemExit(f"Only {len(paths)} image assets were found; refusing to publish an incomplete gallery.")

          def fetch(path):
              url = base + path
              req = Request(url, headers={"User-Agent": "Mozilla/5.0 portfolio-static-mirror"})
              last = None
              for attempt in range(3):
                  try:
                      with urlopen(req, timeout=60) as response:
                          data = response.read()
                      if len(data) < 100 or data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                          raise ValueError(f"Not a valid WebP asset: {path}")
                      dest = Path("public") / path
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(data)
                      return path, len(data)
                  except Exception as e:
                      last = e
                      time.sleep(attempt + 1)
              raise RuntimeError(f"Failed to download {path}: {last}")

          total = 0
          with ThreadPoolExecutor(max_workers=12) as pool:
              futures = [pool.submit(fetch, p) for p in paths]
              for f in as_completed(futures):
                  path, size = f.result()
                  total += size
          print(f"Downloaded {len(paths)} WebP assets ({total:,} bytes).")

          # Add the requested advertising-film skill without disturbing the existing design.
          skill = "سناریونویسی و ساخت فیلم‌های تبلیغاتی"
          if skill not in text:
              marker = '<ul class="skill-list">'
              if marker not in text:
                  raise SystemExit("Could not locate the skills list; refusing to guess the insertion point.")
              text = text.replace(marker, marker + f"<li>{skill}</li>", 1)

          # Correct any text-layer occurrence; raster artwork was separately reviewed.
          text = re.sub(r'IC\s*Center', 'PC Center', text, flags=re.I)
          page.write_text(text, encoding="utf-8")

          # Verify all referenced assets now exist locally.
          missing = [p for p in paths if not (Path("public") / p).is_file()]
          if missing:
              raise SystemExit(f"Missing local assets: {missing[:5]}")
          if skill not in text:
              raise SystemExit("Requested skill was not added.")
          print(f"Verified page ({page.stat().st_size:,} bytes), {len(paths)} local images, and requested skill.")
          PY
          printf "" > public/.nojekyll

      - name: Publish static site to GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
