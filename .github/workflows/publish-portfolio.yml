name: Publish Mohammad Ali Pour portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate the currently published portfolio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error \
            "https://mohammad-ali-pour-resume.flutedant3.chatgpt.site/" \
            --output public/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          raw = p.read_bytes()
          text = raw.decode("utf-8")
          image_count = text.count("data:image/webp;base64,")
          if len(raw) < 50_000_000:
              raise SystemExit(f"Downloaded page is only {len(raw):,} bytes; expected the full self-contained portfolio.")
          if image_count < 500:
              raise SystemExit(f"Only {image_count} embedded WebP images found; refusing to publish an incomplete page.")
          if "محمد علی پور" not in text:
              raise SystemExit("Portfolio title/name check failed.")
          skill = "سناریونویسی و تولید فیلم‌های تبلیغاتی"
          marker = '<ul class="skill-list">'
          if skill not in text:
              if marker not in text:
                  raise SystemExit("Could not find the skills list; refusing to modify an unknown layout.")
              text = text.replace(marker, marker + f"<li>{skill}</li>", 1)
              p.write_text(text, encoding="utf-8")
          print(f"Validated {p.stat().st_size:,} bytes and {image_count} embedded images.")
          PY

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
