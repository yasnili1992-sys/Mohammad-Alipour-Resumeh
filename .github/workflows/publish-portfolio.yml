name: Publish Mohammad Ali Pour portfolio

on:
  push:
    branches: [main]
    paths:
      - 'resume-package.zip.part-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reassemble and validate the portfolio package
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(resume-package.zip.part-*)
          if [ "${#parts[@]}" -ne 3 ]; then
            echo "Expected all three resume-package.zip.part-* files in the same commit; found ${#parts[@]}."
            exit 1
          fi
          cat "${parts[@]}" > resume-package.zip
          unzip -tq resume-package.zip
          mkdir -p extracted public
          unzip -oq resume-package.zip -d extracted
          test -f extracted/index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/index.html")
          raw = p.read_bytes()
          text = raw.decode("utf-8")
          image_count = text.count("data:image/webp;base64,")
          if len(raw) < 50_000_000:
              raise SystemExit(f"Portfolio is only {len(raw):,} bytes; refusing to publish an incomplete file.")
          if image_count < 500:
              raise SystemExit(f"Only {image_count} embedded WebP images found; expected the complete portfolio.")
          if "سناریونویسی و ساخت فیلم‌های تبلیغاتی" not in text:
              raise SystemExit("The requested advertising-film scripting skill is missing.")
          if "IC Center" in text or "Ic Center" in text or "ic center" in text:
              raise SystemExit("Old IC Center text remains in HTML; correct it to PC Center before publishing.")
          print(f"Validated {len(raw):,} bytes and {image_count} embedded WebP image references.")
          PY
          cp extracted/index.html public/index.html

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
