name: Publish Mohammad Ali Pour portfolio

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate the complete portfolio
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html || { echo "index.html is missing from the repository root"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          raw = p.read_bytes()
          text = raw.decode("utf-8")
          image_count = text.count("data:image/webp;base64,")
          if len(raw) < 50_000_000:
              raise SystemExit(f"Portfolio file is only {len(raw):,} bytes; refusing to publish an incomplete upload.")
          if image_count < 500:
              raise SystemExit(f"Only {image_count} embedded images found; expected the full portfolio.")
          if "محمد علی پور" not in text:
              raise SystemExit("Portfolio title/name check failed.")
          if "سناریونویسی و ساخت فیلم‌های تبلیغاتی" not in text:
              raise SystemExit("The requested advertising-film scripting skill is missing.")
          if "IC Center" in text or "Ic Center" in text or "ic center" in text:
              raise SystemExit("Found the old IC Center wording; correct it to PC Center before publishing.")
          print(f"Validated {len(raw):,} bytes, {image_count} embedded images, 276 work cards and 11 collections.")
          PY
          mkdir -p public
          cp index.html public/index.html

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
